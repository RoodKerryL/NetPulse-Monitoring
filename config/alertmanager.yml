# ==============================================================================
# Alertmanager Notification Routing & Webhooks - NetPulse
# ==============================================================================

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance', 'severity']
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 4h
  receiver: 'default-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'discord-noc-channel'
      continue: true

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://localhost:5001/api/alerts'
        send_resolved: true

  # Example Discord / Telegram / Slack webhook for Network Operations Center (NOC)
  - name: 'discord-noc-channel'
    webhook_configs:
      - url: 'https://discord.com/api/webhooks/REPLACE_WITH_YOUR_WEBHOOK_URL'
        send_resolved: true
