# ==============================================================================
# SNMP Exporter Metrics Configuration (IF-MIB & RFC1213-MIB)
# ==============================================================================

if_mib:
  walk:
    - 1.3.6.1.2.1.1.1       # sysDescr
    - 1.3.6.1.2.1.1.3       # sysUpTime
    - 1.3.6.1.2.1.1.5       # sysName
    - 1.3.6.1.2.1.2.2.1.1   # ifIndex
    - 1.3.6.1.2.1.2.2.1.2   # ifDescr
    - 1.3.6.1.2.1.2.2.1.8   # ifOperStatus
    - 1.3.6.1.2.1.31.1.1.1.1 # ifName
    - 1.3.6.1.2.1.31.1.1.1.6 # ifHCInOctets
    - 1.3.6.1.2.1.31.1.1.1.10 # ifHCOutOctets
    - 1.3.6.1.2.1.31.1.1.1.15 # ifHighSpeed
    - 1.3.6.1.2.1.31.1.1.1.18 # ifAlias
  version: 2
  auth:
    community: public
  metrics:
    - name: sysUpTime
      oid: 1.3.6.1.2.1.1.3
      type: gauge
      help: The time since the network management portion of the system was last re-initialized.
    - name: ifOperStatus
      oid: 1.3.6.1.2.1.2.2.1.8
      type: gauge
      help: The current operational state of the interface (1=up, 2=down, 3=testing).
      indexes:
        - labelname: ifIndex
          type: Integer
    - name: ifHCInOctets
      oid: 1.3.6.1.2.1.31.1.1.1.6
      type: counter
      help: Total number of octets received on the interface including framing characters.
      indexes:
        - labelname: ifIndex
          type: Integer
    - name: ifHCOutOctets
      oid: 1.3.6.1.2.1.31.1.1.1.10
      type: counter
      help: Total number of octets transmitted out of the interface.
      indexes:
        - labelname: ifIndex
          type: Integer
    - name: ifHighSpeed
      oid: 1.3.6.1.2.1.31.1.1.1.15
      type: gauge
      help: An estimate of the interface current bandwidth in units of 1,000,000 bits per second.
      indexes:
        - labelname: ifIndex
          type: Integer
